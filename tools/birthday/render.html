<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<!-- The birthday video, drawn one frame at a time by tools/birthday.py. TL (the timeline) is set by the script. -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../js/core.js"></script>
<script src="../../js/events.js"></script>
<script>
const SQ = window.SQ;
SQ.RES = 1;
const W = 1080, H = 1920;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const T = SQ.TEAMS;
const DC = T.find((t) => t.base === 'Red');
const OTHERS = T.filter((t) => t.base !== 'Red');
const R = (i, k) => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = SQ.ease;
const DISPLAY = '"Bungee", Impact, sans-serif';
const BODY = '"Chakra Petch", sans-serif';
SQ.fontDisplay = DISPLAY;
SQ.fontBody = BODY;

function wrap(text, maxW) {
  const out = []; let line = '';
  for (const w of text.split(' ')) { const t = line ? line + ' ' + w : w; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}
function outlined(text, x, y, size, fill, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || ''} ${size}px ${o.font || DISPLAY}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = o.stroke != null ? o.stroke : size * 0.16; ctx.strokeStyle = '#120a22';
  if (ctx.lineWidth) ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y); ctx.restore();
}
function roundRect(x, y, w, h, r) { SQ.roundRect(ctx, x, y, w, h, r); }

function background(t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 100, W / 2, H * 0.42, H * 0.8);
  g.addColorStop(0, '#3a1d6e'); g.addColorStop(0.55, '#1c1140'); g.addColorStop(1, '#0a0818');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // slowly turning light rays behind the cube
  ctx.save(); ctx.translate(W / 2, 860); ctx.rotate(t * 0.12);
  for (let i = 0; i < 14; i++) {
    ctx.rotate(Math.PI * 2 / 14);
    ctx.fillStyle = i % 2 ? 'rgba(255,210,63,0.05)' : 'rgba(255,106,193,0.05)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -1400); ctx.lineTo(90, -1400); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // balloons drifting up
  const cols = T.map((x) => x.color);
  for (let i = 0; i < 12; i++) {
    const sp = 70 + R(i, 1) * 50;
    const y = H + 120 - ((R(i, 2) * (H + 300) + t * sp) % (H + 300));
    const x = (i % 2 ? 60 + R(i, 3) * 160 : W - 220 + R(i, 3) * 160) + Math.sin(t * 0.9 + i) * 18;
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y + 44); ctx.quadraticCurveTo(x + 10, y + 80, x, y + 120); ctx.stroke();
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath(); ctx.ellipse(x, y, 34, 44, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(x - 11, y - 14, 8, 13, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function confetti(t, burstAt, n, strength) {
  const cols = T.map((x) => x.color).concat(['#ffffff', '#ffd23f']);
  for (let i = 0; i < n; i++) {
    let x, y;
    const sp = 120 + R(i, 1) * 160;
    if (burstAt != null) {
      const k = t - burstAt; if (k < 0) return;
      const a = R(i, 5) * Math.PI * 2; const v = (500 + R(i, 6) * 900) * strength;
      x = W / 2 + Math.cos(a) * v * k; y = 700 + Math.sin(a) * v * k * 0.8 + 600 * k * k;
      if (y > H + 40) continue;
    } else {
      y = ((R(i, 2) * (H + 80) + t * sp) % (H + 80)) - 40;
      x = R(i, 3) * W + Math.sin(t * 2 + i) * 30;
    }
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (2 + R(i, 4) * 4) + i);
    ctx.scale(1, Math.cos(t * 6 + i));
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-9, -5, 18, 10); ctx.restore();
  }
}
function cake(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 92, 150, 22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2e6d8'; roundRect(-150, 70, 300, 24, 12); ctx.fill();
  ctx.fillStyle = '#ff6ac1'; roundRect(-125, -10, 250, 90, 18); ctx.fill();
  ctx.fillStyle = '#ffd1ea';
  ctx.beginPath(); ctx.moveTo(-125, 8);
  for (let i = 0; i <= 10; i++) ctx.quadraticCurveTo(-125 + i * 25 - 12, 38 + (i % 2) * 10, -125 + i * 25, 8);
  ctx.lineTo(125, -10); ctx.lineTo(-125, -10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8a4dff'; roundRect(-95, -80, 190, 72, 16); ctx.fill();
  ctx.fillStyle = '#c9b3ff'; roundRect(-95, -80, 190, 18, 9); ctx.fill();
  const cols = ['#ffd23f', '#1fd6f0', '#35d97a', '#ff8f33', '#4f86ff'];
  for (let i = 0; i < 5; i++) {
    const cx = -64 + i * 32;
    ctx.fillStyle = cols[i]; roundRect(cx - 6, -128, 12, 48, 4); ctx.fill();
    const sw = Math.sin(t * 9 + i * 1.3) * 3;
    ctx.fillStyle = 'rgba(255,190,80,0.35)'; ctx.beginPath(); ctx.arc(cx, -142, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcf4a'; ctx.beginPath(); ctx.moveTo(cx, -130); ctx.quadraticCurveTo(cx - 8, -142, cx + sw, -160); ctx.quadraticCurveTo(cx + 8, -142, cx, -130); ctx.fill();
  }
  ctx.restore();
}
function mouth(x, y, s, open) {
  if (open < 0.05) {
    ctx.strokeStyle = '#1a1a22'; ctx.lineWidth = s * 0.05; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y + s * 0.11, s * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    return;
  }
  const w = s * (0.2 + 0.06 * open), h = s * (0.04 + 0.17 * open);
  ctx.fillStyle = '#2a0d14'; roundRect(x - w / 2, y + s * 0.15 - h / 2, w, h, Math.min(w, h) / 2); ctx.fill();
  ctx.fillStyle = '#ff7a8c'; ctx.beginPath(); ctx.ellipse(x, y + s * 0.15 + h * 0.25, w * 0.3, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
}

window.renderAt = function (t) {
  const TL = window.TL;
  const fps = 30;
  const open = TL.mouth[Math.min(TL.mouth.length - 1, Math.floor(t * fps))] || 0;
  const named = t >= TL.name;
  const ended = t >= TL.end;
  SQ.event = SQ.EVENTS.birthday;
  background(t);
  confetti(t, null, ended ? 90 : named ? 60 : 25, 1);
  // intro: an incoming transmission
  if (t < 1.2) {
    ctx.fillStyle = `rgba(6,6,12,${1 - clamp((t - 0.8) / 0.4, 0, 1)})`; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 900; i++) { const v = R(i + Math.floor(t * 8) * 1000, 2); ctx.fillStyle = `rgba(180,180,190,${0.25 * v})`; ctx.fillRect(R(i, 7) * W, R(i, 8) * H, 4, 4); }
    ctx.globalAlpha = 1 - clamp((t - 0.8) / 0.4, 0, 1);
    outlined('INCOMING', W / 2, 860, 110, '#ffd23f');
    outlined('SPECIAL TRANSMISSION', W / 2, 980, 62, '#ffffff');
    ctx.globalAlpha = 1;
    return;
  }
  // header
  ctx.font = `700 28px ${BODY}`; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('S Q U A R E S   T R I N I T Y   ·   S P E C I A L   T R A N S M I S S I O N', W / 2, 64);
  if (!named) {
    outlined(TL.lang === 'pl' ? 'UWAGA!' : 'ATTENTION!', W / 2, 250, 130, '#ffffff');
  } else {
    const k = ease.outBack(clamp((t - TL.name) / 0.5, 0, 1));
    ctx.save(); ctx.translate(W / 2, 200); ctx.scale(k, k);
    outlined(TL.lang === 'pl' ? 'WSZYSTKIEGO NAJLEPSZEGO' : 'HAPPY BIRTHDAY', 0, 0, TL.lang === 'pl' ? 66 : 112, '#ffd23f');
    ctx.restore();
    const name = TL.name_text.toUpperCase();
    // long names get smaller letters so they still fit
    ctx.font = `200px ${DISPLAY}`;
    const size = Math.min(200, Math.floor((200 * 980) / ctx.measureText(name).width));
    ctx.font = `${size}px ${DISPLAY}`;
    const widths = name.split('').map((ch) => ctx.measureText(ch).width);
    let x = W / 2 - widths.reduce((a, b) => a + b, 0) / 2;
    name.split('').forEach((ch, i) => {
      const kk = ease.outBack(clamp((t - TL.name - 0.1 - i * 0.07) / 0.45, 0, 1));
      const bob = Math.sin(t * 6 + i * 0.8) * 14;
      ctx.save(); ctx.translate(x + widths[i] / 2, 380 + bob * size / 200); ctx.scale(kk, kk); ctx.rotate(Math.sin(t * 3 + i) * 0.06);
      outlined(ch, 0, 0, size, T[(i + Math.floor(t * 2)) % T.length].color, { stroke: size * 0.13 });
      ctx.restore(); x += widths[i];
    });
  }
  // DoucheCube, talking
  const s = 420;
  const cy = 900 + Math.sin(t * 2.4) * 10 - open * 14;
  const sx = 540;
  SQ.drawSquare(ctx, sx, cy, s, DC, { mood: 'normal', squash: open * 0.05 - (ended ? Math.abs(Math.sin(t * 6)) * 0.05 : 0), lookX: Math.sin(t * 0.8) * 0.3 });
  SQ.drawSunglasses(ctx, sx, cy - s * 0.04, s * 0.94);
  mouth(sx, cy, s, open);
  // the cake
  if (t >= TL.cake) {
    const k = ease.outBack(clamp((t - TL.cake) / 0.5, 0, 1));
    cake(sx + 320, 1160, 0.85 * k, t);
  }
  // what is being said, in a speech bubble
  const line = TL.lines.find((l) => t >= l.t0 - 0.1 && t < l.t1 + 0.6);
  if (line && !ended) {
    ctx.font = `700 ${line.chorus || line.name ? 58 : 44}px ${line.chorus || line.name ? DISPLAY : BODY}`;
    const lines = wrap(line.text, 820);
    const lh = line.chorus || line.name ? 70 : 56;
    const bh = lines.length * lh + 60;
    const by = 1270;
    const a = clamp((t - line.t0 + 0.1) / 0.15, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    roundRect(90, by, 900, bh, 36); ctx.fill();
    ctx.beginPath(); ctx.moveTo(line.chorus ? 300 : 500, by); ctx.lineTo(line.chorus ? 320 : 540, by - 40); ctx.lineTo(line.chorus ? 360 : 580, by); ctx.fill();
    ctx.fillStyle = line.chorus ? '#8a4dff' : line.name ? '#ff4d5e' : '#1a1030';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 30 + lh / 2 + i * lh));
    ctx.globalAlpha = 1;
  }
  // the other seven join in
  if (t >= TL.chorus[0] - 0.4) {
    OTHERS.forEach((tm, i) => {
      const k = ease.outBack(clamp((t - TL.chorus[0] + 0.4 - i * 0.06) / 0.4, 0, 1));
      const x = 95 + i * 148;
      const jump = (t < TL.chorus[1] + 0.3 || ended) ? Math.abs(Math.sin(t * 7 + i)) * 40 : 0;
      ctx.save(); ctx.translate(x, 1690 - jump); ctx.scale(k, k);
      SQ.drawSquare(ctx, 0, 0, 120, tm, { mood: 'happy' });
      ctx.restore();
    });
  }
  // end card
  if (ended) {
    confetti(t, TL.end, 160, 1);
    const k = ease.outBack(clamp((t - TL.end - 0.2) / 0.5, 0, 1));
    ctx.save(); ctx.translate(W / 2, 1390); ctx.scale(k, k);
    outlined(TL.lang === 'pl' ? 'STO LAT!' : 'MANY HAPPY RETURNS!', 0, 0, TL.lang === 'pl' ? 110 : 70, '#ffffff');
    ctx.restore();
    ctx.globalAlpha = clamp((t - TL.end - 0.8) / 0.5, 0, 1);
    outlined(TL.lang === 'pl' ? 'od DoucheCube i wszystkich kwadratów' : 'from DoucheCube and all the squares', W / 2, 1520, 40, '#ffd1ea', { font: BODY, weight: 700, stroke: 8 });
    ctx.globalAlpha = 1;
  }
};
window.ready = document.fonts.load('100px Bungee').then(() => document.fonts.load('700 40px "Chakra Petch"')).then(() => true);
</script></body></html>
